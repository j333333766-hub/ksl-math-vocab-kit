      · 교과서 문장(팝업과 4-2 문장 읽기)을 교과서 보기의 노란 부분에 맞춤: “다음 다면체는 몇 면체인지 쓰시오.” → “다음 다면체는 몇 면체인지 말하시오.”(김화경 외 198쪽), “다면체인 것을 모두 고르시오.” → “다면체를 <보기>에서 모두 고르시오.”(강옥기 외 214쪽). 성우는 ‘보기에서’로 읽음 — 선생님 요청(11/26)
      · 문장 팝업에서도 도형을 뺌(문장만). 팝업이 뜨면 선생님이 팝업 문장을 읽음 — 선생님 요청(11/26)
      · 교과서 보기: 선생님은 캡처의 노란 부분만 읽음(“다음 다면체는 몇 면체인지 말하고” / “다면체의 이름을 말하시오.” / “다면체를 보기에서 모두 고르시오.”). 첫 캡처의 노란 박스를 ‘다음’부터로 늘림 — 선생님 요청(11/26)
      · 문장 팝업을 교과서 캡처 아래쪽에 띄움(캡처를 가리지 않게) — 선생님 요청(11/26)
      · 문장 팝업에는 ‘교과서’ 꼬리표를 두지 않음 — 선생님 요청(11/26)
      · 교과서 맛보기 2/3(교실에서 선생님이 교과서 문장 세 개를 한꺼번에 읽던 쪽)을 뺌. 대신 교과서 보기에서 캡처 하나를 읽으면 바로 그 문장(용례) 하나가 팝업으로 뜨고 선생님이 읽음(캡처 → 문장, 세 번). 교과서 맛보기는 2쪽 — 선생님 요청(11/26)
      · 뜻 자막(‘낱말: 뜻’)은 31차시 v5처럼 따로 두지 않음 — 뜻 카드에 낱말과 뜻이 함께 보이므로
  다음에 할 일 (2026-11-26 기준):
    - v3 화면을 선생님이 확인하기. 확인 뒤 업체 전달용 스토리보드 pptx 만들기
    - 선생님: MYBOX [KERIS 의견 반영 수정본] 폴더에 v3 html + 스토리보드 pptx 올리기(마감 11/29 일)
    - 공동 저장소(김해윤/)에 올리기 — 올리기 전 허락받기
  (아래는 v2 때 적은 것)
  다음에 할 일 (2026-11-13 기준):

    - 수정본으로 낼 때 업체 전달용 스토리보드 pptx(메모 json) 만들기

    - 확인 필요: 교과서 문장 “다면체인 것을 모두 고르시오.”는 짐작으로 씀. 쓰시는 교과서 문장으로 바꿀지 선생님께 여쭙기

<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body><title>33. 다면체 v3</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* Layout: a content player like the 과학편 design reference — 목차 panel on the left, a fixed 1280×720 stage scaled to fit on the right.
   The page commits to one light look (the content's own visual world), so colors are set once and not themed. */
:root{
  --navy:#18364a; --mint:#e3f1e7; --teal:#3dbb9f; --blue:#2f6fe4; --orange:#e8761a; --hl:#f9b233; --coral:#f2726b;
  --frame:#e4e7eb; --side:#f4f5f7; --ink:#18364a; --muted:#5d6f7d; --soft:#e7f0fb; --line:#d5dbe1;
  --f-ui:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif; --f-title:"Jua","Noto Sans KR","Apple SD Gothic Neo",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{margin:0;background:#d9dee3;color:var(--ink);font-family:var(--f-ui);-webkit-font-smoothing:antialiased;word-break:keep-all}
button{font-family:inherit;color:inherit}
button:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
.wrap{max-width:1500px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 28px}
.shell{display:grid;grid-template-columns:236px minmax(0,1fr);gap:12px;background:var(--frame);border-radius:18px;padding:12px}
.side{background:var(--side);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px;min-width:0}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid var(--line);border-radius:9px;overflow:hidden;background:#fff}
.tabs button{display:flex;flex-direction:column;align-items:center;gap:1px;padding:6px 0 5px;border:0;background:#fff;color:#3c4a56;cursor:pointer;font-size:12.5px;font-weight:800;line-height:1.3}
.tabs button+button{border-left:1px solid var(--line)}
.tabs button svg{width:18px;height:18px}
.tabs button.on{background:var(--blue);color:#fff}
.pane{display:flex;flex-direction:column;gap:10px;min-height:0}
.pane[hidden]{display:none}
.memo-h{font-size:13px;font-weight:900;color:var(--navy)}
#memoTxt{width:100%;min-height:230px;resize:vertical;border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit;font-size:14px;line-height:1.6;color:var(--ink);background:#fff}
.memo-f{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;font-weight:700;color:var(--muted)}
.memo-f button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:4px 10px;font-size:12px;font-weight:800;cursor:pointer}
.bx-h{margin:2px 0 0;font-size:13px;font-weight:900;color:var(--navy)}
.bx{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.bx li{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid #e1e5ea;border-radius:10px;padding:7px 8px;font-size:13px;font-weight:700;line-height:1.45}
.bx li .t{flex:1;min-width:0}
.bx li .t b{font-size:16px;font-weight:900}
.bx li .t small{display:block;font-size:11.5px;font-weight:700;color:var(--muted)}
.bx .play{width:30px;height:30px;border-radius:50%;border:2px solid var(--navy);background:#dcecff;color:var(--navy);display:grid;place-items:center;cursor:pointer;flex:none;padding:0}
.bx .play svg{width:16px;height:16px}
.bx .play.mine{background:#ffd9d6}
.bx-empty{margin:0;font-size:12.5px;line-height:1.55;color:var(--muted)}
.lesson{border:1px solid #c9dbf7;background:#eef4ff;border-radius:10px;padding:9px 11px}
.lesson .chip{display:inline-block;font-size:11.5px;font-weight:700;color:var(--blue);border:1.5px solid var(--blue);border-radius:999px;padding:0 8px;background:#fff}
.lesson b{display:block;margin-top:4px;font-size:15px;color:#1d3f8c}
.mods{background:#fff;border:1px solid #e1e5ea;border-radius:12px;padding:8px;display:grid;gap:6px}
.mod{display:flex;align-items:center;gap:8px;width:100%;padding:9px 10px;border-radius:9px;background:#f2f4f6;border:0;font-size:13.5px;font-weight:700;color:#46525d;cursor:pointer;text-align:left;line-height:1.3}
.mod .nm{flex:1;min-width:0}
.mod .dots{display:flex;gap:3px;flex:none}
.mod .dots i{width:7px;height:7px;border-radius:50%;background:#cfd8e0}
.mod .dots i.d{background:var(--teal)}
.mod .dots i.c{box-shadow:0 0 0 2px #fff,0 0 0 3.5px var(--teal)}
.mod.on{background:var(--teal);color:#fff}
.mod.on .dots i{background:rgba(255,255,255,.45)} .mod.on .dots i.d{background:#fff}
.mod .ok{width:16px;height:16px;flex:none;color:var(--teal);display:none}
.mod.done .ok{display:block} .mod.on .ok{color:#fff}
.side .hint{margin-top:auto;font-size:12px;line-height:1.55;color:var(--muted)}
.main{min-width:0;display:flex;flex-direction:column;gap:8px}
.stagebox{position:relative;width:100%;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:var(--mint)}
.credit{font-size:12px;line-height:1.5;color:var(--muted);padding:0 4px}
@media (max-width:900px){ .shell{grid-template-columns:168px minmax(0,1fr);gap:8px;padding:8px} .side{padding:8px;gap:8px} .mod{font-size:12px;padding:8px 7px;gap:5px} .mod .dots i{width:6px;height:6px} .lesson b{font-size:14px} .side .hint{display:none} }
@media (max-width:640px){ .shell{grid-template-columns:1fr} .side{flex-direction:row;flex-wrap:wrap;align-items:center;padding:8px} .side .lesson{flex:none} .side .tabs{display:none} #pane-toc{flex:1 1 100%} #pane-memo,#pane-box{display:none} #pane-toc{min-width:0;width:100%} .mods{display:flex;overflow-x:auto;gap:6px;padding:6px;width:100%} .mod{flex:none;width:auto;white-space:nowrap} .mod .nm br{display:none} }
.rotate-hint{display:none;margin:0;font-size:14px;font-weight:700;line-height:1.5;color:var(--navy);background:#fff3df;border:2px solid var(--hl);border-radius:10px;padding:6px 12px}
@media (max-width:600px) and (orientation:portrait){ .rotate-hint{display:block} }
@media (max-width:900px) and (orientation:landscape) and (max-height:560px){
  .wrap{padding-block:6px} .shell{padding:6px} .credit{display:none}
  .stagebox{width:min(100%, calc((100svh - 24px) * 16 / 9));margin-inline:auto}
}

/* ---------- stage (1280×720 design px, scaled) ---------- */
.stage{position:absolute;left:0;top:0;width:1280px;height:720px;transform-origin:0 0;transform:scale(var(--s,1));overflow:hidden;
  background-color:var(--mint);background-image:var(--confetti);font-size:28px;--pagebg:var(--mint)}
.stage.instant *, .stage.instant *::before, .stage.instant *::after{transition:none!important;animation-duration:0s!important;animation-delay:0s!important}
.scene{position:absolute;inset:0}
.scene svg.scene-bg, .scene svg.scene-fg{position:absolute;inset:0;width:100%;height:100%}
.scene .decor{position:absolute;inset:0;width:100%;height:100%}
.hud{position:absolute;left:0;right:0;top:0;height:76px;display:flex;justify-content:space-between;align-items:center;padding:0 20px;z-index:30;pointer-events:none}
.hud>*{pointer-events:auto}
.hud-l{display:flex;gap:10px}
.rb{width:50px;height:50px;border-radius:50%;border:3px solid var(--navy);display:grid;place-items:center;cursor:pointer;padding:0;box-shadow:0 3px 0 rgba(24,54,74,.35)}
.rb svg{width:28px;height:28px}
.rb.gear{background:#e05a52} .rb.snd{background:#33b06b} .rb.glb{background:#6f86d8}
.rb.snd .x{display:none} .rb.snd.off .x{display:inline} .rb.snd.off .w{display:none}
.hud-r{display:flex;gap:14px}
.pt{display:flex;align-items:center;height:38px;padding:0 16px 0 46px;border-radius:999px;background:var(--navy);color:#fff;font-weight:900;font-size:21px;position:relative;min-width:84px;box-shadow:0 3px 0 rgba(24,54,74,.3)}
.pt i{position:absolute;left:-6px;top:50%;transform:translateY(-50%);width:44px;height:36px;display:grid;place-items:center}
.pt i svg{width:40px;height:32px}
.pt b{margin-left:auto}
.pt.bump{animation:bump .5s}
@keyframes bump{40%{transform:scale(1.18)}}
.nav{position:absolute;top:322px;width:56px;height:76px;border:0;background:none;cursor:pointer;z-index:28;padding:0}
.nav svg{width:56px;height:76px}
.nav.prev{left:10px} .nav.next{right:10px}
.nav:disabled{opacity:.28;cursor:default}
.nav.ready svg{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.18)}}
.pagebar{position:absolute;left:22px;bottom:16px;z-index:28;display:flex;align-items:center;gap:10px}
.pageno{font-size:15px;font-weight:800;color:var(--navy);background:rgba(255,255,255,.85);border:2px solid var(--navy);border-radius:999px;padding:3px 14px}
.replay{display:flex;align-items:center;gap:6px;font-size:15px;font-weight:800;color:var(--navy);background:#fff;border:2px solid var(--navy);border-radius:999px;padding:3px 13px 3px 9px;cursor:pointer;box-shadow:0 2px 0 rgba(24,54,74,.25)}
.replay svg{width:18px;height:18px}
.replay[hidden]{display:none}
.instr{position:absolute;left:50%;top:84px;transform:translateX(-50%);z-index:27;display:flex;align-items:center;gap:12px;max-width:1060px;
  background:var(--navy);color:#fff;border-radius:999px;padding:9px 26px 9px 10px;font-size:25px;font-weight:800;white-space:nowrap;box-shadow:0 4px 0 rgba(24,54,74,.25)}
.instr button{width:40px;height:40px;border-radius:50%;border:0;background:#fff;color:var(--navy);display:grid;place-items:center;cursor:pointer;flex:none;padding:0}
.instr button svg{width:24px;height:24px}
.cap{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);z-index:29;max-width:1000px;display:flex;align-items:center;gap:12px;
  background:rgba(24,54,74,.88);color:#fff;border-radius:16px;padding:10px 22px;font-size:27px;font-weight:700;line-height:1.35;text-align:center}
.cap em{font-style:normal;font-size:16px;font-weight:800;background:#fff;color:var(--navy);border-radius:999px;padding:2px 10px;flex:none}
.toast{position:absolute;right:24px;bottom:22px;z-index:40;display:flex;align-items:center;gap:8px;background:var(--coral);color:var(--navy);border:3px solid var(--navy);
  border-radius:999px;padding:6px 20px 6px 10px;font-size:22px;font-weight:900;opacity:0;transform:translateY(16px);transition:.35s;pointer-events:none}
.toast.on{opacity:1;transform:none}
.toast i{width:40px;height:30px;display:grid;place-items:center} .toast i svg{width:36px;height:28px}
.menu{position:absolute;left:20px;top:80px;z-index:45;background:#fff;border:3px solid var(--navy);border-radius:16px;padding:10px;display:grid;gap:6px;min-width:250px;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.menu button{display:flex;justify-content:space-between;align-items:center;gap:16px;border:0;background:#f2f5f7;border-radius:10px;padding:10px 14px;font-size:20px;font-weight:800;cursor:pointer;text-align:left}
.menu button span{font-size:16px;color:var(--muted)}
.start{position:absolute;inset:0;z-index:60;display:grid;place-items:end center;padding-bottom:70px;background:rgba(227,241,231,.25)}
.start button{display:flex;align-items:center;gap:14px;font-size:34px;font-weight:900;background:var(--hl);border:4px solid var(--navy);border-radius:999px;padding:14px 40px 14px 26px;cursor:pointer;box-shadow:0 6px 0 rgba(24,54,74,.35)}
.start button svg{width:40px;height:40px}

/* ---------- shared pieces inside scenes ---------- */
.kw-t{color:var(--blue)} .kw-s{color:var(--orange)}
.card{position:absolute;background:#fff;border:3px solid var(--navy);border-radius:18px;box-shadow:0 5px 0 rgba(24,54,74,.12)}
.ear::after{content:"";position:absolute;right:-3px;bottom:-3px;width:28px;height:28px;background:var(--ear) no-repeat center/100% 100%}
.chip{display:inline-flex;align-items:center;gap:8px;border-radius:999px;font-weight:800}
.chip.navy{background:var(--navy);color:#fff;padding:6px 20px;font-size:24px}
.chip.ghost{border:2px solid var(--navy);padding:2px 12px;font-size:18px;background:#fff}
.who{position:absolute}
.who svg{width:100%;height:auto;display:block;overflow:visible}
.bubble{position:absolute;background:#fff;border:3px solid var(--navy);border-radius:22px;padding:16px 24px;font-size:29px;font-weight:800;line-height:1.4;
  opacity:0;transform:scale(.85);transform-origin:var(--to,50% 100%);transition:opacity .25s, transform .3s cubic-bezier(.3,1.6,.5,1);z-index:12}
.bubble.on{opacity:1;transform:none}
.bubble.dim{opacity:.38;transform:none}
.bubble::after{content:"";position:absolute;width:26px;height:26px;background:#fff;border-right:3px solid var(--navy);border-bottom:3px solid var(--navy);
  left:var(--tx,40px);bottom:-15px;transform:rotate(45deg)}
.bubble.tail-up::after{bottom:auto;top:-15px;transform:rotate(225deg)}
.btn{display:inline-flex;align-items:center;gap:10px;border:3px solid var(--navy);border-radius:16px;background:#fff;padding:10px 22px;font-size:25px;font-weight:900;cursor:pointer;box-shadow:0 4px 0 rgba(24,54,74,.25)}
.btn svg{width:28px;height:28px}
.btn:disabled{opacity:.4;cursor:default}
.btn.primary{background:var(--hl)}
.btn.rec{background:#ffd9d6}
.btn.rec.live{background:var(--coral);color:#fff;animation:recpulse 1s infinite}
@keyframes recpulse{50%{box-shadow:0 0 0 10px rgba(242,114,107,.25)}}
.btn.ghost{background:transparent;box-shadow:none;border-style:dashed}
.lis{width:50px;height:50px;border-radius:50%;border:3px solid var(--navy);background:#dcecff;color:var(--navy);display:grid;place-items:center;cursor:pointer;flex:none;padding:0}
.lis svg{width:28px;height:28px}
.lis.playing{background:var(--hl)}
.ck{width:34px;height:34px;border-radius:50%;background:var(--teal);color:#fff;display:grid;place-items:center;flex:none;transform:scale(0);transition:transform .3s cubic-bezier(.3,1.6,.5,1)}
.ck svg{width:22px;height:22px}
.ck.on{transform:none}
.badge{display:inline-block;width:30px;height:30px;vertical-align:-4px;margin-left:2px}
.badge svg{width:100%;height:100%}
.uword{text-decoration:underline;text-decoration-thickness:4px;text-underline-offset:7px}
.blink{animation:blink 1.4s ease-in-out infinite}
@keyframes blink{50%{opacity:.35}}
.pop-in{animation:popin .45s cubic-bezier(.3,1.6,.5,1) both}
@keyframes popin{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
.fade-up{animation:fadeup .5s ease both}
@keyframes fadeup{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
.hide{opacity:0;pointer-events:none}

/* digest diagram */
.dg{position:absolute}
.dg svg.digest{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.dg .org, .dg .nondig{transition:opacity 1s ease}
.dg.ph-out .org, .dg.ph-out .nondig{opacity:0}
.dg .nondig{opacity:.4}
.dg .outline{stroke-width:3px}
.dg .ov{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.dg .hull{fill:none;stroke:var(--blue);stroke-width:4;stroke-dasharray:10 8;stroke-linejoin:round;opacity:0;transition:opacity .4s}
.dg.hull-on .hull{opacity:1;animation:hulldraw 1.4s linear}
@keyframes hulldraw{from{stroke-dashoffset:300}to{stroke-dashoffset:0}}
.dg .org.flash{animation:orgflash .6s ease-in-out}
@keyframes orgflash{50%{filter:brightness(1.55) drop-shadow(0 0 5px #fff6a8)}}
.dg .tag-sys{position:absolute;background:var(--blue);color:#fff;font-weight:900;font-size:22px;border-radius:999px;padding:3px 14px;border:3px solid var(--navy);white-space:nowrap}

<script>window.__AUDIO={};</script><script>/* Character set for the 소화계 sample (v2, redrawn): 이안, 안나, 선생님, 보건 선생님, 초록이.

<script>/* Backgrounds, props and icons for the 소화계 sample (all drawn by hand as SVG). Version 2: redrawn scenes with more detail;

(function () {

    globe: `<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.4" fill="none" stroke="#fff" stroke-width="1.8"/><path d="M3.8 12h16.4M12 3.6c2.6 2.4 3.6 5.2 3.6 8.4s-1 6-3.6 8.4c-2.6-2.4-3.6-5.2-3.6-8.4s1-6 3.6-8.4z" fill="none" stroke="#fff" stroke-width="1.6"/></svg>`,
    lips: `<svg viewBox="0 0 40 28" aria-hidden="true"><path d="M3 14c5-8 10-10 17-6 7-4 12-2 17 6-5 8-11 11-17 11S8 22 3 14z" fill="#f06a7a" stroke="${N}" stroke-width="2"/><path d="M5 14c6 1 10 2 15 2s9-1 15-2" fill="none" stroke="${N}" stroke-width="1.8"/></svg>`,
    ear: `<svg viewBox="0 0 30 36" aria-hidden="true"><path d="M8 13c0-6 4-10 9-10s9 4 9 10c0 5-3 7-5 9s-2 6-6 8-8-1-8-5" fill="#f7c9a8" stroke="${N}" stroke-width="2" stroke-linecap="round"/><path d="M13 13c0-3 2-5 4-5s4 2 4 5-3 3-3 6" fill="none" stroke="${N}" stroke-width="1.8" stroke-linecap="round"/></svg>`,

    star: (on) => `<svg viewBox="0 0 48 46" aria-hidden="true"><path d="M24 3l6.3 13.4 14.7 1.9-10.8 10.2 2.7 14.6L24 36l-12.9 7.1 2.7-14.6L3 18.3l14.7-1.9z" fill="${on ? '#ffc93c' : 'none'}" stroke="${on ? '#c98a00' : '#ffd96a'}" stroke-width="3" stroke-linejoin="round"/>${on ? '<path d="M17 14l4-1" stroke="#fff3c4" stroke-width="3" stroke-linecap="round"/>' : ''}</svg>`,
    bell: `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a6 6 0 0 0-6 6v4l-2 3h16l-2-3V9a6 6 0 0 0-6-6z" fill="#ffd34d" stroke="${N}" stroke-width="1.8" stroke-linejoin="round"/><circle cx="12" cy="19" r="2" fill="${N}"/></svg>`,
  };

  /* soft confetti texture used on every inner page (as in the 과학편 design reference) */
  const confetti = (() => {
    const bits = [
      [20, 30, 18, 4, -25, '#c7dcc6'], [140, 18, 14, 4, 30, '#d7cfae'], [220, 90, 16, 4, -60, '#bcd3bb'],
      [70, 150, 12, 4, 15, '#d0c8a6'], [180, 200, 18, 4, -20, '#c7dcc6'], [250, 240, 10, 4, 50, '#b9cbb8'],
      [30, 240, 10, 3, 70, '#cfd9c0'], [110, 90, 8, 3, -40, '#d7cfae'],
    ];
    const s = bits.map(([x, y, w, h, r, c]) => `<rect x='${x}' y='${y}' width='${w}' height='${h}' rx='1.5' fill='${c}' transform='rotate(${r} ${x} ${y})'/>`).join('');
    return `url("data:image/svg+xml;utf8,${encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' width='280' height='280'>${s}</svg>`)}")`;
  })();

  /* ---------------------------------------------------------------- shared drawing helpers
     Background lines are softer and thinner than the characters' outlines so the people and the UI stay in front. */
  const L = '#5d6b73';                     // soft outline for walls, windows, furniture far away
  const r1 = n => Math.round(n * 10) / 10;

  /* a window with sky, far buildings and tree tops, mullions and a sill. id must be unique per scene. */
  function windowPane(id, x, y, w, h, o = {}) {
    const fr = o.frame || '#fbf8f1', cols = o.cols || 2, gx = x + 10, gy = y + 10, gw = w - 20, gh = h - 20;
    const trees = [];
    const tc = ['#b9d3b1', '#a7c69f', '#c6dcbe', '#b0cda8'];
    for (let k = 0, tx = gx - 10; tx < gx + gw + 20; k++) {
      const rr = 22 + ((k * 13) % 17);
      trees.push(`<circle cx="${r1(tx)}" cy="${r1(gy + gh - 8 - ((k * 7) % 12))}" r="${rr}" fill="${tc[k % tc.length]}"/>`);
      tx += rr * 1.25;
    }
    const bld = o.building ? `<g fill="#e2e8eb" stroke="#ccd6db" stroke-width="1.5">
        <rect x="${r1(gx + gw * .18)}" y="${r1(gy + gh * .42)}" width="${r1(gw * .38)}" height="${r1(gh * .6)}"/>
        <rect x="${r1(gx + gw * .62)}" y="${r1(gy + gh * .55)}" width="${r1(gw * .26)}" height="${r1(gh * .5)}"/></g>
      <g fill="#d3dde2">${[0, 1, 2].map(i => [0, 1].map(j => `<rect x="${r1(gx + gw * .22 + i * gw * .11)}" y="${r1(gy + gh * .5 + j * 22)}" width="${r1(gw * .06)}" height="10"/>`).join('')).join('')}</g>` : '';
    let mull = '';
    for (let k = 1; k < cols; k++) { const mx = gx + gw * k / cols; mull += `<rect x="${r1(mx - 4)}" y="${gy}" width="8" height="${gh}" fill="${fr}" stroke="${L}" stroke-width="1.4"/>`; }
    const tr = o.transom ? `<rect x="${gx}" y="${r1(gy + o.transom - 4)}" width="${gw}" height="8" fill="${fr}" stroke="${L}" stroke-width="1.4"/>` : '';

    <defs><linearGradient id="${id}Sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#cbe3f1"/><stop offset=".75" stop-color="#e9f3f8"/><stop offset="1" stop-color="#f3f8f6"/></linearGradient>
      <clipPath id="${id}Clip"><rect x="${gx}" y="${gy}" width="${gw}" height="${gh}"/></clipPath></defs>
    <rect x="${x}" y="${y}" width="${w}" height="${h}" rx="5" fill="${fr}" stroke="${L}" stroke-width="2.5"/>
    <rect x="${gx}" y="${gy}" width="${gw}" height="${gh}" fill="url(#${id}Sky)"/>
    <g clip-path="url(#${id}Clip)">
      <g fill="#ffffff" opacity=".85"><ellipse cx="${r1(gx + gw * .25)}" cy="${r1(gy + gh * .2)}" rx="${r1(gw * .09)}" ry="9"/><ellipse cx="${r1(gx + gw * .32)}" cy="${r1(gy + gh * .17)}" rx="${r1(gw * .07)}" ry="11"/><ellipse cx="${r1(gx + gw * .74)}" cy="${r1(gy + gh * .3)}" rx="${r1(gw * .08)}" ry="8"/></g>
      ${bld}

      <path d="M${gx} ${r1(gy + gh * .1)} L${r1(gx + gw * .22)} ${gy} H${r1(gx + gw * .34)} L${gx} ${r1(gy + gh * .45)} Z M${r1(gx + gw * .5)} ${r1(gy + gh)} L${r1(gx + gw)} ${r1(gy + gh * .28)} V${r1(gy + gh * .44)} L${r1(gx + gw * .62)} ${r1(gy + gh)} Z" fill="#ffffff" opacity=".28"/>

    <rect x="${x - 10}" y="${y + h - 2}" width="${w + 20}" height="11" rx="4" fill="${o.sill || '#efe6d4'}" stroke="${L}" stroke-width="2"/>
  </g>`;
  }

  /* floor seen in perspective: base colour, boards/tiles that run towards the vanishing point, cross lines that spread towards the viewer */
  function floor(y0, base, line, o = {}) {
    const vx = o.vx || 640, vy = o.vy || y0 - 260, rows = o.rows || [y0 + 26, y0 + 62, y0 + 110, y0 + 176];
    let ln = '';
    for (let bx = -1200; bx <= 2480; bx += o.step || 150) {
      const t = (y0 - vy) / (720 - vy), xa = vx + (bx - vx) * t;

    const ha = ((h % 12) + m / 60) * 30 - 90, ma = m * 6 - 90, rad = a => a * Math.PI / 180;
    let ticks = '';
    for (let k = 0; k < 12; k++) {
      const a = rad(k * 30), r0 = k % 3 === 0 ? r - 11 : r - 8;
      ticks += `<path d="M${r1(cx + Math.cos(a) * r0)} ${r1(cy + Math.sin(a) * r0)} L${r1(cx + Math.cos(a) * (r - 4))} ${r1(cy + Math.sin(a) * (r - 4))}"/>`;
    }
    return `<g class="clock">
    <circle cx="${cx}" cy="${cy + 3}" r="${r + 5}" fill="#000" opacity=".06"/>
    <circle cx="${cx}" cy="${cy}" r="${r + 5}" fill="#7d8c94" stroke="${L}" stroke-width="2"/>
    <circle cx="${cx}" cy="${cy}" r="${r}" fill="#fffdf8" stroke="${L}" stroke-width="1.5"/>
    <g stroke="#53626b" stroke-width="2" stroke-linecap="round">${ticks}</g>
    <path d="M${cx} ${cy} L${r1(cx + Math.cos(rad(ha)) * r * .5)} ${r1(cy + Math.sin(rad(ha)) * r * .5)}" stroke="#2f3d45" stroke-width="4" stroke-linecap="round"/>
    <path d="M${cx} ${cy} L${r1(cx + Math.cos(rad(ma)) * r * .76)} ${r1(cy + Math.sin(rad(ma)) * r * .76)}" stroke="#2f3d45" stroke-width="2.6" stroke-linecap="round"/>
    <circle cx="${cx}" cy="${cy}" r="3.2" fill="#e8765f"/>

  .bubble .lis{width:46px;height:46px;margin-right:12px;vertical-align:middle}

  .who svg.chr{transition:transform .5s ease}

  /* ---------------------------------------------------------------- 컷 넘기기(10/28 사용자 의견)

  /* ---------------------------------------------------------------- recording (녹음) */
  function recorder(ctx, opt = {}) {
    const wrap = document.createElement('div'); wrap.className = 'recbox' + (opt.compact ? ' compact' : '');
    wrap.innerHTML = `<button class="btn rec" type="button">${A.ic.mic}<span>녹음하기</span></button>` +
      `<div class="wave" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><b>0:00</b></div>` +
      `<button class="btn mine" type="button" hidden>${A.ic.play}<span>내 소리 듣기</span></button>`;
    const bRec = wrap.querySelector('.rec'), wave = wrap.querySelector('.wave'), bMine = wrap.querySelector('.mine'), tEl = wave.querySelector('b');
    let st = 'idle', had = false, stream = null, mr = null, chunks = [], url = null, t0 = 0, tick = 0, cap = 0, discard = false;
    const label = s2 => { bRec.querySelector('span').textContent = s2; };
    const fmt = n => Math.floor(n / 60) + ':' + String(n % 60).padStart(2, '0');
    function live(v) {
      bRec.classList.toggle('live', v); wave.classList.toggle('on', v);
      label(v ? '멈추기' : (had ? '다시 녹음하기' : '녹음하기'));
    }
    function release() {
      clearTimeout(cap); clearInterval(tick);
      if (mr && mr.state !== 'inactive') { try { mr.stop(); } catch (e) { /* ignore */ } }
      if (stream) stream.getTracks().forEach(t => t.stop());
      stream = null; if (activeRec === api) activeRec = null;
    }
    async function start() {
      if (activeRec && activeRec !== api) activeRec.cancel();
      activeRec = api; ctx.gen++; stopNar(); $$('.playing', scene).forEach(b => b.classList.remove('playing'));
      st = 'rec'; discard = false; t0 = Date.now(); live(true); tEl.textContent = '0:00';
      tick = setInterval(() => { tEl.textContent = fmt(Math.floor((Date.now() - t0) / 1000)); }, 200);
      cap = setTimeout(stop, 10000);                         // the permission prompt may stay open
      try {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !window.MediaRecorder) throw new Error('no-mic');
        const s2 = await navigator.mediaDevices.getUserMedia({ audio: true });
        if (st !== 'rec' || ctx.run.dead || activeRec !== api) { s2.getTracks().forEach(t => t.stop()); return; }
        stream = s2; mr = new MediaRecorder(stream); chunks = [];
        mr.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
        mr.onstop = () => {
          if (discard || !chunks.length) return;
          const blob = new Blob(chunks, { type: mr.mimeType || 'audio/webm' });
          if (url) URL.revokeObjectURL(url);
          url = URL.createObjectURL(blob); bMine.hidden = false;
          if (opt.key) { state.recs[opt.key] = { key: opt.key, label: opt.label || '', url }; renderBox(); }
        };
        mr.start();
        clearTimeout(cap); cap = setTimeout(stop, 8000);
      } catch (e) {
        /* 마이크를 쓸 수 없는 화면: 녹음 상태만 보여 준다 */
        if (st !== 'rec') return;
        mr = null; clearTimeout(cap); cap = setTimeout(stop, 3000);
      }
    }
    function stop() {
      if (st !== 'rec') return;
      release(); st = 'done'; had = true; live(false); wrap.classList.add('recorded');
      if (opt.onDone) opt.onDone();
    }
    const api = {
      el: wrap,
      cancel() { if (st !== 'rec') return; discard = true; release(); st = had ? 'done' : 'idle'; live(false); },
      enable(v = true) { bRec.disabled = !v; },
      restoreDone() { st = 'done'; had = true; live(false); wrap.classList.add('recorded'); },
      demoLive() { st = 'rec'; live(true); tEl.textContent = '0:02'; },
      demoDone() { st = 'done'; had = true; live(false); wrap.classList.add('recorded'); },
    };
    bRec.onclick = () => { if (st === 'rec') stop(); else start(); };
    bMine.onclick = () => { if (!url) return; stopNar(); if (activeRec) activeRec.cancel(); mineAudio = new Audio(url); mineAudio.muted = muted; mineAudio.play().catch(() => {}); };
    if (opt.disabled) bRec.disabled = true;
    ctx.run.hook(() => { discard = true; release(); stopMine(); });
    return api;

  let popRun = null, popClose = null;

  /* 읽는 낱말까지 노란 바탕을 깐다. 소리가 나오는 동안은 소리의 재생 위치를, 소리가 나오지 않으면 시계를 따른다 */
  function karaoke(run, words, times, clip) {
    let raf = 0, done = false;
    const clear = () => words.forEach(w => w.classList.remove('lit'));
    if (SHOT) return clear;
    const t0 = performance.now();
    const tick = () => {
      if (done || run.dead) return;
      const live = NAR.dataset.clip === clip && !NAR.paused && NAR.currentTime > 0;
      const wall = (performance.now() - t0 - 400) / 1000;
      const t = live ? NAR.currentTime : Math.max(0, wall);
      words.forEach((w, k) => w.classList.toggle('lit', t >= times[k]));
      raf = requestAnimationFrame(tick);
    };
    raf = requestAnimationFrame(tick);
    return () => { done = true; cancelAnimationFrame(raf); words.forEach(w => w.classList.add('lit')); run.later(450, clear); if (run.dead) clear(); };
  }
  /* 내 녹음을 인물의 말처럼 들려준다 (말하는 인물의 입이 움직인다) */
  function playURL(run, url, o = {}) {
    if (run.dead) return Promise.reject(CANCEL);
    stopNar();
    if (SHOT || !url) return Promise.resolve();
    return new Promise((res, rej) => {
      const a = new Audio(url); a.muted = muted; mineAudio = a;
      const svg = chrSvg(o.chr);
      let fin = false, fb = 0;
      const end = () => {
        if (fin) return; fin = true; clearTimeout(fb);
        a.onended = a.onerror = a.onpause = null;
        if (svg) svg.classList.remove('talking');
        run.pending.delete(rej); run.enders.delete(stopIt);
        res();
      };
      const stopIt = () => { try { a.pause(); } catch (e) { /* ignore */ } end(); };
      run.pending.add(rej); run.enders.add(stopIt);
      if (svg) svg.classList.add('talking');
      a.onended = end; a.onerror = end; a.onpause = end;
      fb = setTimeout(end, 12000);
      const p = a.play(); if (p && p.catch) p.catch(end);
    });
  }

      // 11/26 김수철 교수: 그림 아래 안내 글(가린 곳에 들어갈 낱말을…)은 뺌. 출처(강옥기 외 2025, 동아출판, 214쪽)는 스토리보드에만
      return bl;
    } });


  /* ---------- 6. 정리와 활용 */
  PAGES.push({
    m: 6, sub: '1/1', kind: 'html', id: 'sum', name: '오늘 배운 내용', instr: ['오늘 배운 내용을 확인해 보세요.', 'i_m6sum'],
    build(c) {
      put(c.sc, 'chip navy ttl-chip', '오늘 배운 내용', 'top:152px;font-size:26px;padding:6px 26px');
      const card = ear(put(c.sc, 'card sumcard', '', 'left:150px;top:206px;width:980px;height:336px;background:#e8f1fb'), '#e3f1e7', '#d0e1f2');
      const items = [
        { html: '<span class="w">다면체</span>', top: 70 },
        { html: '<span class="def" style="max-width:520px">다각형인 면으로만 둘러싸인<br>입체도형</span>', top: 150 },
      ];
      items.forEach(it => { const r = put(card, 'sumrow', '', `top:${it.top}px`); put(r, '', it.html, null, 'span'); });
      c.done();
      c.todo = () => [];
      put(card, 'sumfig', `<svg viewBox="0 0 420 140" width="400" height="134" role="img" aria-label="면이 4개, 5개, 6개인 다면체"><g transform="translate(10,22) scale(.9)">${TETRA}</g><g transform="translate(148,26) scale(.85)">${PRISM}</g><g transform="translate(288,8) scale(.85)">${CUBE}</g></svg>`, 'top:90px');
    },
  });

  /* ---------- 7. 아웃트로 */
  const PTS_MAX = 9;   // v3: 말하기 1, 듣기 2(따라 하기, 듣고 고르기), 읽기 5(뜻 확인하기 2, 교과서 문장, 활용 연습 2), 쓰기 1 (v2: 7)
  PAGES.push({
    m: 7, sub: '', kind: 'anim', id: 'outro', auto: false, name: '오늘 배운 어휘와 별점',
    build(c) {
      put(c.sc, 'band', '', 'left:0;top:352px;width:1280px;height:368px');
      c.today = ear(put(c.sc, 'card today hide', '<span class="chip navy">오늘 배운 어휘</span><span class="tws"><span class="tw">다면체</span></span>', 'left:220px;top:94px;width:640px;height:212px'));
      c.ch = put(c.sc, 'who hide', C.chorok({ pose: 'cheer', ex: 'cheer' }), 'left:880px;top:92px;width:212px');
      c.stars = put(c.sc, 'starbar hide', [0, 1, 2, 3, 4].map(() => `<i>${A.ic.star(false)}</i>`).join(''), 'left:370px;top:316px;width:540px;height:88px');
      c.note = put(c.sc, 'starnote hide', '다시 해 보면 별을 더 받을 수 있어요.', 'left:0;right:0;top:410px');
    },
    steps: [
      async c => { await c.wait(200); show(c.today); show(c.ch); sfx('pop'); await c.wait(450); await c.play('m7_1'); await c.wait(300); },
      async c => {
        show(c.stars); await c.wait(400);
        const got = Object.values(state.pts).reduce((a, b) => a + b, 0);
        const n = got >= PTS_MAX ? 5 : Math.max(0, Math.min(4, Math.round(5 * got / PTS_MAX)));
        const ss = $$('i', c.stars);
        for (let k = 0; k < 5; k++) { if (k < n) { ss[k].innerHTML = A.ic.star(true); ss[k].classList.add('lit'); sfx('sparkle'); } await c.wait(280); }
        c.stars.setAttribute('role', 'img'); c.stars.setAttribute('aria-label', `별 ${n}개`);
        if (n < 5) { show(c.note); await c.wait(200); await c.play('m7_more', { chr: c.ch, cap: '' }); }
        await c.wait(400);
      },
      /* v6-1: 다음 시간 학습 내용(‘다음 시간에는…’ 카드·단원 띠·m7_3)은 뺐다(10/29 김수철) */
    ],
  });

  /* ---------------------------------------------------------------- boot */
  buildSide();
  go(0, { noPlay: true });
  if (SHOT) { elStart.hidden = true; started = true; }
  else elStart.hidden = false;

  /* capture hooks (used only with ?shot) */
  const fontsReady = (document.fonts ? Promise.all([document.fonts.load('40px Jua'), document.fonts.load('700 20px "Noto Sans KR"'), document.fonts.load('800 20px "Noto Sans KR"')]).then(() => document.fonts.ready) : Promise.resolve()).catch(() => {});
  /* 업체 전달용: 이 쪽에서 나오는 모든 말(낱말·교과서 문장 듣기, 정답·오답 반응)이 스토리라인·스토리보드 대사 칸에 나오게 한다(2026-11-13 선생님).
     스토리라인 도구는 쪽의 함수 글에서 대사 id를 찾으므로 id 목록을 함수로 붙인다. 화면 동작은 바뀌지 않는다 */
  const ALLSAY = {"rec1": ["w_damyeonche"], "ox1": ["fb_ok", "fb_ans", "m3_4", "ox1b_fix"], "bookA": ["t_bk1e", "t_bk1d", "t_bk1c"], "q1a": ["q1a", "fb_ok", "fb_ans"], "q3": ["q3a", "fb_ok_q1", "fb_write_retry", "fb_write_unclear", "fb_ans_q1"], "q2a": ["fb_ok", "fb_ans", "q2s"], "q2": ["fb_ok", "fb_ans", "q2t"]};
  PAGES.forEach(p => { if (ALLSAY[p.id]) p.script = new Function('return ' + JSON.stringify(ALLSAY[p.id])); });
  window.__S = {
    pages: PAGES.map(p => ({ id: p.id, m: p.m, sub: p.sub, kind: p.kind, steps: p.steps ? p.steps.length : 0 })),
    async go(i, step = -1, keep = false) {
      await fontsReady;
      if (!keep) { state.got.clear(); state.mem = {}; Object.keys(state.pts).forEach(k => { state.pts[k] = 0; }); renderPts(); toastChain = Promise.resolve(); elToast.classList.remove('on'); }
      const ctx = go(i, { noPlay: true });
      const P = PAGES[i];
      if (P.steps) for (let k = 0; k <= step && k < P.steps.length; k++) await P.steps[k](ctx);
      return true;
    },
    async demo(name, ...a) { const ctx = cur.ctx; await ctx.demo[name](...a); return true; },
    async popup(kind, step) { await openPopup(kind, null, step); return true; },
    tab(n) { showTab(n); },
    toast(sk) { toast(sk); },
    completeAll() { PAGES.forEach((p, j) => state.done.add(j)); Object.assign(state.pts, { say: 3, listen: 5, read: 2, write: 1 }); renderPts(); updateChrome(); },
    setPts(o) { Object.assign(state.pts, o); renderPts(); },
  };
})();
</script>
